<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | لوحة التحكم</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            direction: rtl;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-logo {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 15px;
        }

        .login-header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .login-header p {
            color: #888;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .remember-forgot a {
            color: #667eea;
            text-decoration: none;
        }

        .remember-forgot a:hover {
            text-decoration: underline;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            border: none;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.show {
            display: block;
        }

        .alert-error {
            background-color: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert-success {
            background-color: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .alert-warning {
            background-color: #ffe;
            color: #cc3;
            border: 1px solid #ffc;
        }

        .lockout-message {
            text-align: center;
            color: #c33;
            font-weight: 600;
            margin-top: 15px;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            color: #888;
            font-size: 12px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
                margin: 20px;
            }

            .login-header h1 {
                font-size: 24px;
            }

            .login-logo {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>

<div class="login-container">
    <!-- Header -->
    <div class="login-header">
        <div class="login-logo">
            <i class="fas fa-book-open"></i>
        </div>
        <h1>إقرأ ماركت</h1>
        <p>لوحة التحكم - تسجيل الدخول</p>
    </div>

    <!-- Alert Messages -->
    <div id="alertMessage" class="alert"></div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleLogin(event)">
        <!-- Username -->
        <div class="form-group">
            <label for="username">اسم المستخدم</label>
            <input 
                type="text" 
                id="username" 
                name="username" 
                placeholder="أدخل اسم المستخدم"
                required 
                autocomplete="username"
            >
        </div>

        <!-- Password -->
        <div class="form-group">
            <label for="password">كلمة المرور</label>
            <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="أدخل كلمة المرور"
                required 
                autocomplete="current-password"
            >
        </div>

        <!-- Remember & Forgot -->
        <div class="remember-forgot">
            <label class="checkbox-group">
                <input type="checkbox" id="rememberMe" name="rememberMe">
                <span>تذكرني</span>
            </label>
            <a href="#" onclick="showForgotPassword(event)">هل نسيت كلمة المرور؟</a>
        </div>

        <!-- Login Button -->
        <button type="submit" class="btn-login" id="loginBtn">
            <span id="loginBtnText">تسجيل الدخول</span>
        </button>

        <!-- Lockout Message -->
        <div id="lockoutMessage" class="lockout-message"></div>
    </form>

    <!-- Footer -->
    <div class="footer">
        <p>💡 استخدم بيانات المشرف لتسجيل الدخول إلى لوحة التحكم</p>
        <p style="margin-top: 10px; color: #aaa;">© 2024 مكتبة إقرأ - جميع الحقوق محفوظة</p>
    </div>
</div>

<!-- Scripts -->
<script src="js/auth.js"></script>
<script src="js/security.js"></script>
<script>
    // التحقق من الجلسة عند فتح الصفحة
    document.addEventListener('DOMContentLoaded', () => {
        const session = auth.getSession();
        if (session) {
            // إذا كانت هناك جلسة صحيحة، انتقل إلى لوحة التحكم
            window.location.href = 'admin.html';
        }

        // استعادة اسم المستخدم إذا كان "تذكرني" مفعل
        const savedUsername = localStorage.getItem('admin_remember_username');
        if (savedUsername) {
            document.getElementById('username').value = savedUsername;
            document.getElementById('rememberMe').checked = true;
            document.getElementById('password').focus();
        }

        // التحقق من الحظر
        updateLockoutUI();
    });

    // معالج تسجيل الدخول
    async function handleLogin(event) {
        event.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const rememberMe = document.getElementById('rememberMe').checked;

        const loginBtn = document.getElementById('loginBtn');
        const loginBtnText = document.getElementById('loginBtnText');

        // تعطيل الزر
        loginBtn.disabled = true;
        loginBtnText.innerHTML = '<span class="loading-spinner"></span> جاري المعالجة...';

        try {
            // تسجيل الدخول
            const result = await auth.login(username, password);

            if (result.success) {
                showAlert('تم تسجيل الدخول بنجاح! جاري التحويل...', 'success');

                // حفظ اسم المستخدم إذا تم تحديد "تذكرني"
                if (rememberMe) {
                    localStorage.setItem('admin_remember_username', username);
                } else {
                    localStorage.removeItem('admin_remember_username');
                }

                // الانتظار قبل التحويل
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 1500);
            } else {
                showAlert(result.message, 'error');

                // معالجة الحالات الخاصة
                if (result.code === 'ACCOUNT_LOCKED') {
                    updateLockoutUI();
                }

                loginBtn.disabled = false;
                loginBtnText.textContent = 'تسجيل الدخول';
            }
        } catch (error) {
            console.error('Login error:', error);
            showAlert('حدث خطأ أثناء محاولة تسجيل الدخول', 'error');

            loginBtn.disabled = false;
            loginBtnText.textContent = 'تسجيل الدخول';
        }
    }

    // عرض رسائل التنبيه
    function showAlert(message, type = 'info') {
        const alertEl = document.getElementById('alertMessage');
        alertEl.textContent = message;
        alertEl.className = `alert show alert-${type}`;

        // إخفاء الرسالة بعد 5 ثوان
        setTimeout(() => {
            alertEl.classList.remove('show');
        }, 5000);
    }

    // تحديث واجهة الحظر
    function updateLockoutUI() {
        const attempts = auth.getFailedAttempts();
        const lockoutEl = document.getElementById('lockoutMessage');
        const form = document.getElementById('loginForm');

        if (auth.isLockedOut()) {
            const timeRemaining = Math.ceil(
                (auth.lockoutDurationMs - (Date.now() - attempts.lastAttempt)) / 1000 / 60
            );

            lockoutEl.textContent = `⛔ تم حظر المحاولات مؤقتاً. حاول بعد ${timeRemaining} دقيقة`;
            lockoutEl.style.display = 'block';
            form.style.opacity = '0.5';
            form.style.pointerEvents = 'none';
        } else {
            lockoutEl.style.display = 'none';
            form.style.opacity = '1';
            form.style.pointerEvents = 'auto';
        }
    }

    // عرض نموذج نسيان كلمة المرور
    function showForgotPassword(event) {
        event.preventDefault();
        showAlert(
            'للمساعدة، يرجى التواصل مع المشرف الرئيسي عبر البريد الإلكتروني أو الهاتف',
            'warning'
        );
    }

    // مفتاح سريع: Enter للدخول
    document.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !document.getElementById('loginBtn').disabled) {
            document.getElementById('loginForm').dispatchEvent(new Event('submit'));
        }
    });
</script>

</body>
</html>
